[package]
name = "tree-sitter-mailng"
description = "An RFC5322 (email) message grammar for Tree-sitter"
version = "0.1.0"
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "mail", "rfc5322"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/madduck/tree-sitter-mailng"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1"

[dev-dependencies]
tree-sitter = "0.24"

[[example]]
name = "mailng"
path = "examples/rust.rs"
