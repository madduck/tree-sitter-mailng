[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-mailng"
description = "An RFC5322 (email) message grammar for Tree-sitter"
version = "0.1.0"
keywords = ["incremental", "parsing", "tree-sitter", "mail", "rfc5322"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "martin f. krafft", email = "tree-sitter-mailng@pobox.madduck.net" },
]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/madduck/tree-sitter-mailng"

[project.optional-dependencies]
core = ["tree-sitter~=0.22"]

[tool.cibuildwheel]
build = "cp39-*"
build-frontend = "build"
